name: Run Selenium Maven Tests

on:
  push:
  schedule:
    - cron: '0 2 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Chrome
        run: |
          sudo apt update
          sudo apt install -y google-chrome-stable

      - name: Build and run tests
        run: mvn clean test
